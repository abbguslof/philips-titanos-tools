site_name: Philips Titan OS Toolkit
site_description: Jailbreak, root, and reverse-engineering toolkit for Philips TVs running Titan OS on Novatek NT72690.
site_url: https://abbguslof.github.io/philips-titanos-tools/
repo_url: https://github.com/abbguslof/philips-titanos-tools
repo_name: abbguslof/philips-titanos-tools
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
exclude_docs: |
  evidence/**/*.md
  samples/**/*.md
  payloads/**/*.md
  tools/**/*.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start here:
      - Supported models: models.md
      - FAQ: guides/faq.md
      - USB autoroot: guides/usb-autoroot.md
      - Persistent root: guides/persistent-root.md
      - Restore to stock: guides/restore-to-stock.md
      - Recovery gate: guides/recovery-gate.md
      - Firmware extraction: guides/firmware-extraction.md
  - Research:
      - All research: research/index.md
      - 169.001 verification: research/35-tpn236e-169001-static-2026-11-15.md
      - 43PUS7608/12 field scan: research/34-tpn236e-43pus7608-2026-11-14.md
      - 70PUS8108/60 network surface: research/33-tpn236e-70pus8108-network-surface-2026-11-14.md
      - Deep jailbreak roadmap: research/25-deep-jailbreak-roadmap.md
      - Firmware container: research/03-firmware-container-timg-pimg-nfsb.md
      - Verified findings: research/12-verified-findings-and-dead-ends.md
  - Reference:
      - File formats: reference/file-formats.md
      - Partition map: reference/partition-map.md
      - Glossary: reference/glossary.md
      - Remote sequences: reference/remote-sequences.md
  - Project:
      - Project status: project.md
      - Community: community.md
