[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "philips-titanos-tools"
version = "0.4.4"
description = "Research and right-to-repair tooling for Philips Titan OS (Novatek NT72690)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Gustav Löfqvist" }]
dependencies = ["requests>=2.28,<3"]

[tool.setuptools]
packages = []
